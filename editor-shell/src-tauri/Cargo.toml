# The desktop editor shell (M2.6). Standalone Cargo workspace (its own `[workspace]`) so the parent
# metrocalk workspace doesn't claim it — like the spikes. Real core + real bridge, no mocks.
[workspace]

[package]
name = "metrocalk-editor-shell-app"
version = "0.1.0"
edition = "2021"
description = "M2.6 desktop editor — transparent WebView2 (M2.5 UI) over a native wgpu viewport (M2.2 scene), ADR-008 single-window."
publish = false

[[bin]]
name = "metrocalk-editor-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native Open/Save file dialogs for the M10.3 File menu (project New/Open/Save/Save As).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

# The real authoritative core + the M2.6 bridge (apply_edit / project_full — no MockCore).
metrocalk-core = { path = "../../core" }
metrocalk-ecs = { path = "../../ecs" }
metrocalk-editor-shell = { path = "..", features = [
    # The app build DOES have these, so the format registry must say so. Without forwarding them the
    # registry would tell a user with an .fbx that this build cannot read one, while it happily can.
    "assets-fbx",
    "assets-ktx2",
    "interchange-3dxml",
] }
metrocalk-animation = { path = "../../animation" }
# MOB: the deterministic match kernel, so a real match can drive the live viewport (ADR-091/092).
metrocalk-gameplay = { path = "../../gameplay" }
# The local asset/import substrate (M4): glTF import + content-addressed store + GPU mesh packing.
# `fbx`+`ktx2` enable the native FFI importers (M11.1, ADR-040) — the .exe imports FBX (ufbx) and KTX2/basis
# (basis-universal). The wasm funnel never builds this crate with them (the browser converts/transcodes
# server-side — the explicit seam).
metrocalk-assets = { path = "../../assets", features = ["fbx", "ktx2"] }
# Asset Lab's native bake/unwrap/optimization commands are invoked directly by
# the desktop command loop, so the standalone Tauri workspace must link the
# conditioning crate as well as the editor-shell bridge library.
metrocalk-conditioning = { path = "../../conditioning", features = ["native"] }
# The token economy (M7): the wallet/ledger types the three paid sinks meter against.
metrocalk-economy = { path = "../../economy" }
# The physics subsystem (M8.2): the project-owned `Physics` trait (Rapier wrapped). Only the binary
# links it — `capscene` (the bridge lib) stays physics-free. No rapier/parry type leaks across (CI-gated).
metrocalk-physics = { path = "../../physics" }
# The interchange tier (M8.5) — URDF/USD import behind the Interchange trait. No urdf_rs/openusd type
# leaks across (CI grep-gated, like rapier in /physics).
metrocalk-interchange = { path = "../../interchange" }
# The transform gizmo (M9.1 / G1) — translate/rotate/scale behind the Gizmo trait. Its public surface is
# plain arrays (glam internal only); render.rs converts to/from its glam viewport types at the boundary.
metrocalk-gizmo = { path = "../../gizmo" }
# The scene-space subsystem: the canonical f64 transform, the hierarchy evaluator, the picking pipeline
# (scene BVH + per-asset mesh BVH + canonical HitResult) and the one tolerance policy. Public surface is
# plain f64 arrays, same discipline as the gizmo crate — glam stays inside it.
metrocalk-spatial = { path = "../../spatial" }
# The terrain subsystem (M19 / ADR-104). The app owns the worker pool and the GPU slot table; the crate
# itself is pure computation with no threads or I/O, so a chunk build is a pure function any worker can run.
metrocalk-terrain = { path = "../../terrain" }

# Native wgpu viewport (M2.2 instanced render path). DX12 disabled — wgpu-hal 29's DX12 fights the
# `windows` crate version Tauri/webview2-com pins (the diamond M2.1/M2.3 documented); Vulkan is the
# project's native backend (ADR-003), GLES the fallback.
wgpu = { version = "29.0.3", default-features = false, features = ["vulkan", "gles", "wgsl"] }
pollster = "0.4.0"
raw-window-handle = "0.6.2"
bytemuck = { version = "1.19", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
# PNG encode (pure Rust) for the M14.2 live-thumbnail readback (render.rs RTT → a `data:` URL) AND the
# offscreen render-evidence bench (examples/mesh_frame_bench.rs). Desktop-only crate (not in the wasm funnel).
png = "0.18"

[dev-dependencies]
# The shader compiler wgpu itself uses, at wgpu's own version — so a WGSL mistake is a TEST failure on
# any machine, instead of a runtime panic on a machine with a GPU. Every colour conversion this renderer
# performs now lives in WGSL, and `cargo check` cannot see a word of it: the shaders are `include_str!`
# and compile at device creation. A dev-dependency is the cheapest way to make them gated.
naga = { version = "29.0.3", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

# The unit-test binary links the entire app (Tauri, wgpu, wasmtime, flecs, …) AND the naga front-end the
# shader-validation test needs. With full debug info that overflows the PDB format itself — `LINK : fatal
# error LNK1318: Unexpected PDB error; LIMIT (12)` — and no amount of cleaning fixes it, because the
# limit is the format's. Line tables keep a readable backtrace at a fraction of the size.
[profile.test]
debug = "line-tables-only"
