[package]
name = "metrocalk-xatlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[build-dependencies]
cc = "1.2"

# This is the workspace's deliberately narrow FFI boundary. Unsafe is denied by default and every
# declaration/call site is individually justified with `#[expect(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

